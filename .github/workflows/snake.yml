name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gerar cobra neon
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#00ff9c&color_dots=#0d1117,#06331f,#0a5c3a,#00a86b,#00ff9c
            dist/snake-neon-light.svg?color_snake=#ff2bd6&color_dots=#ebedf0,#b3f5d8,#5fe0a8,#14c47d,#008f55

      - name: publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
