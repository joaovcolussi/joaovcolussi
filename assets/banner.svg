<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace" role="img" aria-label="João Victor Colussi — engenharia de dados em formação">
  <title>João Victor Colussi</title>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00ff9c" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff9c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1000" height="300" fill="#07090f"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- HUD superior -->
  <text x="40" y="44" font-size="13" fill="#ff2bd6" letter-spacing="2">[ SYS://JVC.NODE ]</text>
  <text x="230" y="44" font-size="13" fill="#4b5563" letter-spacing="1">build 2.0 · pt-BR · UTC-03</text>
  <circle cx="872" cy="39" r="5" fill="#00ff9c" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="885" y="44" font-size="13" fill="#00ff9c" letter-spacing="2">ONLINE</text>
  <line x1="40" y1="60" x2="960" y2="60" stroke="#00ff9c" stroke-opacity=".25" stroke-dasharray="2 6"/>

  <!-- nome com glitch RGB -->
  <g font-size="54" font-weight="700">
    <text x="40" y="140" fill="#00e5ff" opacity=".75" textLength="615.6" lengthAdjust="spacingAndGlyphs">JOÃO VICTOR COLUSSI<animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;6 0;-6 1;3 -1;0 0;0 0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="40" y="140" fill="#ff2bd6" opacity=".75" textLength="615.6" lengthAdjust="spacingAndGlyphs">JOÃO VICTOR COLUSSI<animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;-6 0;6 1;-3 -1;0 0;0 0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="40" y="140" fill="#f5f7fa" textLength="615.6" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">JOÃO VICTOR COLUSSI</text>
  </g>

  <text x="40" y="182" font-size="18" fill="#c9d1d9"><tspan fill="#00ff9c">//</tspan> dados <tspan fill="#4b5563">·</tspan> python <tspan fill="#4b5563">·</tspan> sql <tspan fill="#4b5563">·</tspan> java <tspan fill="#4b5563">— em busca do primeiro estágio</tspan></text>

  <!-- prompt digitando -->
  <text x="40" y="240" font-size="18" fill="#ff2bd6">jvc@colussi</text>
  <text x="159" y="240" font-size="18" fill="#4b5563">:</text>
  <text x="170" y="240" font-size="18" fill="#00e5ff">~</text>
  <text x="181" y="240" font-size="18" fill="#4b5563">$</text>
  
  <clipPath id="type1"><rect x="203" y="222" height="25.2" width="0">
    <animate attributeName="width" values="0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;129.6;140.4;151.2;162.0;172.8;183.6;194.4;205.2;216.0;226.8;237.6;248.4;259.2;270.0;280.8;291.6;302.4;313.2;324.0;334.8;345.6;356.4;367.2;378.0;388.8;399.6;410.4;421.2;432.0;442.8;453.6;464.4;475.2;486.0;496.8;507.6;518.4" keyTimes="0.0;0.0731;0.0796;0.0861;0.0926;0.0991;0.1056;0.112;0.1185;0.125;0.1315;0.138;0.1444;0.1509;0.1574;0.1639;0.1704;0.1769;0.1833;0.1898;0.1963;0.2028;0.2093;0.2157;0.2222;0.2287;0.2352;0.2417;0.2481;0.2546;0.2611;0.2676;0.2741;0.2806;0.287;0.2935;0.3;0.3065;0.313;0.3194;0.3259;0.3324;0.3389;0.3454;0.3519;0.3583;0.3648;0.3713;0.3778" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect></clipPath>
  <text x="203" y="240" font-size="18" fill="#c9d1d9" textLength="518.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#type1)">./iniciar --carreira --modo=aprendizado_continuo</text>
  <rect y="224.7" width="9.9" height="18" fill="#00ff9c">
    <animate attributeName="x" values="203;215.8;226.6;237.4;248.2;259.0;269.8;280.6;291.4;302.2;313.0;323.8;334.6;345.4;356.2;367.0;377.8;388.6;399.4;410.2;421.0;431.8;442.6;453.4;464.2;475.0;485.8;496.6;507.4;518.2;529.0;539.8;550.6;561.4;572.2;583.0;593.8;604.6;615.4;626.2;637.0;647.8;658.6;669.4;680.2;691.0;701.8;712.6;723.4" keyTimes="0.0;0.0731;0.0796;0.0861;0.0926;0.0991;0.1056;0.112;0.1185;0.125;0.1315;0.138;0.1444;0.1509;0.1574;0.1639;0.1704;0.1769;0.1833;0.1898;0.1963;0.2028;0.2093;0.2157;0.2222;0.2287;0.2352;0.2417;0.2481;0.2546;0.2611;0.2676;0.2741;0.2806;0.287;0.2935;0.3;0.3065;0.313;0.3194;0.3259;0.3324;0.3389;0.3454;0.3519;0.3583;0.3648;0.3713;0.3778" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <!-- radar -->
  <g transform="translate(860 165)">
    <circle r="78" fill="none" stroke="#00ff9c" stroke-opacity=".35"/>
    <circle r="52" fill="none" stroke="#00ff9c" stroke-opacity=".2"/>
    <circle r="26" fill="none" stroke="#00ff9c" stroke-opacity=".2"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#00ff9c" stroke-opacity=".15"/>
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#00ff9c" stroke-opacity=".15"/>
    <line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(0)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(15)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(30)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(45)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(60)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(75)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(90)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(105)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(120)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(135)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(150)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(165)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(180)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(195)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(210)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(225)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(240)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(255)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(270)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(285)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(300)"/><line x1="0" y1="-78" x2="0" y2="-66" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(315)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(330)"/><line x1="0" y1="-78" x2="0" y2="-72" stroke="#00ff9c" stroke-opacity=".5" transform="rotate(345)"/>
    <g>
      <path d="M0 0 L78 0 A78 78 0 0 0 55.15 -55.15 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="78" y2="0" stroke="#00ff9c" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="-30" cy="-35" r="3" fill="#ff2bd6">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="40" cy="20" r="3" fill="#00ff9c">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="-15" cy="45" r="3" fill="#00e5ff">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.0s" repeatCount="indefinite"/></circle>
    <text x="0" y="104" font-size="11" fill="#4b5563" text-anchor="middle" letter-spacing="2">VARRENDO OPORTUNIDADES</text>
  </g>

  <!-- cantos HUD -->
  <path d="M14 36 V14 H36" fill="none" stroke="#00ff9c" stroke-width="2"/><path d="M986 36 V14 H964" fill="none" stroke="#00ff9c" stroke-width="2"/><path d="M14 264 V286 H36" fill="none" stroke="#00ff9c" stroke-width="2"/><path d="M986 264 V286 H964" fill="none" stroke="#00ff9c" stroke-width="2"/>

  <!-- feixe de varredura + scanlines + vinheta -->
  <rect width="1000" height="60" fill="url(#beam)">
    <animate attributeName="y" values="-60;300" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="300" fill="url(#scan)"/>
  <rect width="1000" height="300" fill="url(#vignette)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="10" fill="none" stroke="#00ff9c" stroke-opacity=".35"/>
</svg>
